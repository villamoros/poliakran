# Servicios de apoyo para desarrollo local.
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poliakran
      POSTGRES_PASSWORD: poliakran
      POSTGRES_DB: poliakran
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliakran"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
